name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck, unit tests, and e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-version.mjs
      - run: npm test
      - run: npm run typecheck
      # The CLI tarball ships the built SPA and the release workflow copies it, so a UI that no
      # longer builds must fail here (on the PR) instead of at publish time.
      - run: npm run build:ui
      - run: npm run test:e2e
